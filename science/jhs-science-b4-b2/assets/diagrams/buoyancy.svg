<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">自由靜浮且無其他垂直外力的受力圖</title><desc id="desc">同一物體的受力示意；懸吊、碰底或有其他外力時須另畫力圖</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif;fill:#203940;font-size:24px}.small{font-size:20px}.line{stroke:#58727b;stroke-width:3;fill:none;marker-end:url(#arr)}.blue{stroke:#006c91}.red{stroke:#a74420}.dash{stroke-dasharray:7 6}</style><rect width="100%" height="100%" rx="16" fill="#f4f8f6"/><rect x="70" y="155" width="570" height="142" fill="#d6edf3"/><path d="M70 155H640" stroke="#006c91" stroke-width="3"/><rect x="290" y="110" width="130" height="90" fill="#ccaa7e" stroke="#735d3b" stroke-width="3"/><circle cx="355" cy="156" r="5" fill="#203940"/><path class="line blue" d="M355 156V65"/><path class="line red" d="M355 156V247"/><text x="390" y="85">浮力 Fb 向上</text><text x="390" y="254">重量 W 向下</text><text x="90" y="65">自由靜浮：Fb=W</text><text x="87" y="281">浸入部分才對應排液體積</text><text x="24" y="322" class="small">同一物體的受力示意；懸吊、碰底或有其他外力時須另畫力圖</text></svg>