<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">食物鏈、遺體排遺與分解者的關係</title><desc id="desc">光合生態系的簡化關係；非完整食物網，不把能量畫成循環</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif;fill:#203940;font-size:24px}.small{font-size:20px}.line{stroke:#58727b;stroke-width:3;fill:none;marker-end:url(#arr)}.blue{stroke:#006c91}.red{stroke:#a74420}.dash{stroke-dasharray:7 6}</style><rect width="100%" height="100%" rx="16" fill="#f4f8f6"/><text x="70" y="70">草</text><text x="305" y="70">蝗蟲</text><text x="560" y="70">青蛙</text><path class="line" d="M115 62H278"/><path class="line" d="M375 62H540"/><path class="line dash" d="M85 90V155"/><path class="line dash" d="M340 90V155"/><path class="line dash" d="M590 90V155"/><rect x="65" y="165" width="585" height="65" rx="10" fill="#e1eddf"/><text x="250" y="205">各層遺體與排遺</text><path class="line" d="M350 230V268"/><text x="306" y="295">分解者</text><text x="45" y="270" class="small">營養角色，不只位於鏈尾</text><text x="465" y="286" class="small">物質可回到環境</text><text x="24" y="342" class="small">光合生態系的簡化關係；非完整食物網，不把能量畫成循環</text></svg>