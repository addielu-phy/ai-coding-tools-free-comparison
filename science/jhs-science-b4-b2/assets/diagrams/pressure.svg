<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">相同垂直力作用於不同接觸面積</title><desc id="desc">箭頭代表垂直接觸力，不是把壓力畫成向量；面積僅為示意</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif;fill:#203940;font-size:24px}.small{font-size:20px}.line{stroke:#58727b;stroke-width:3;fill:none;marker-end:url(#arr)}.blue{stroke:#006c91}.red{stroke:#a74420}.dash{stroke-dasharray:7 6}</style><rect width="100%" height="100%" rx="16" fill="#f4f8f6"/><path d="M50 245H665" stroke="#58727b" stroke-width="4"/><rect x="110" y="192" width="90" height="52" rx="4" fill="#8dd6e2"/><rect x="430" y="192" width="190" height="52" rx="4" fill="#8dd6e2"/><path class="line red" d="M155 75V180"/><path class="line red" d="M525 75V180"/><text x="95" y="58">相同力 F</text><text x="465" y="58">相同力 F</text><text x="65" y="285">小面積 → 壓力較大</text><text x="400" y="285">大面積 → 壓力較小</text><text x="270" y="155">P=F/A</text><text x="24" y="322" class="small">箭頭代表垂直接觸力，不是把壓力畫成向量；面積僅為示意</text></svg>