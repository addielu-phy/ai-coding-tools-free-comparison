<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">同質量反應物在條件相同時比較快慢與總量</title><desc id="desc">曲線非實測；同質量碳酸鈣、酸過量、同溫，只改變接觸面積</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif;fill:#203940;font-size:24px}.small{font-size:20px}.line{stroke:#58727b;stroke-width:3;fill:none;marker-end:url(#arr)}.blue{stroke:#006c91}.red{stroke:#a74420}.dash{stroke-dasharray:7 6}</style><rect width="100%" height="100%" rx="16" fill="#f4f8f6"/><path class="line" d="M90 265H655"/><path class="line" d="M90 265V45"/><path d="M90 265C145 90 210 90 620 90" stroke="#006c91" stroke-width="5" fill="none"/><path d="M90 265C240 255 260 90 620 90" stroke="#a74420" stroke-width="5" fill="none"/><text x="120" y="45">累積產氣量</text><text x="550" y="295">時間</text><text x="160" y="129">粉末：較快</text><text x="390" y="205">塊狀：較慢</text><text x="395" y="67">同一平台：最後總量相同</text><text x="24" y="322" class="small">曲線非實測；同質量碳酸鈣、酸過量、同溫，只改變接觸面積</text></svg>